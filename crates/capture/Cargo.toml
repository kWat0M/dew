[package]
name = "dew-capture"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "fs", "rt", "macros", "sync", "io-util", "net"] }
tracing = "0.1"
x11rb = { version = "0.14", features = ["xtest"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
