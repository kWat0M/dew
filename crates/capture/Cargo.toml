[package]
name = "dew-capture"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["process", "time", "fs", "rt", "macros", "sync", "io-util", "net"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
